<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI 情報資訊艙</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #050713;
        --bg-deep: #02030a;
        --surface: rgba(10, 16, 32, 0.84);
        --surface-strong: rgba(15, 23, 42, 0.96);
        --line: rgba(125, 211, 252, 0.22);
        --line-strong: rgba(34, 211, 238, 0.5);
        --text: #f8fafc;
        --muted: #a9b8d0;
        --dim: #71809b;
        --cyan: #22d3ee;
        --blue: #2563eb;
        --green: #22c55e;
        --red: #fb3f4f;
        --pink: #f43f8f;
        --amber: #f7c948;
        --shadow-cyan: 0 0 26px rgba(34, 211, 238, 0.22);
        --shadow-red: 0 0 32px rgba(251, 63, 79, 0.2);
        --radius-sm: 6px;
        --radius-md: 10px;
        --radius-lg: 16px;
        --max: 1280px;
        --display: Orbitron, "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
        --body: "JetBrains Mono", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-width: 320px;
        background:
          radial-gradient(circle at 14% 10%, rgba(34, 211, 238, 0.18), transparent 30%),
          radial-gradient(circle at 86% 18%, rgba(251, 63, 79, 0.14), transparent 28%),
          linear-gradient(180deg, var(--bg), var(--bg-deep) 58%, #03040a);
        color: var(--text);
        font-family: var(--body);
        font-size: 16px;
        line-height: 1.7;
      }

      body::before {
        position: fixed;
        inset: 0;
        z-index: -2;
        content: "";
        background-image:
          linear-gradient(rgba(34, 211, 238, 0.055) 1px, transparent 1px),
          linear-gradient(90deg, rgba(34, 211, 238, 0.055) 1px, transparent 1px);
        background-size: 56px 56px;
        mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.9), transparent 82%);
      }

      body::after {
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        content: "";
        background: repeating-linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.035),
          rgba(255, 255, 255, 0.035) 1px,
          transparent 1px,
          transparent 5px
        );
        opacity: 0.22;
      }

      a {
        color: inherit;
      }

      button,
      input {
        font: inherit;
      }

      button,
      a,
      input,
      summary {
        outline-offset: 4px;
      }

      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      summary:focus-visible {
        outline: 2px solid var(--cyan);
      }

      .shell {
        width: min(100% - 32px, var(--max));
        margin: 0 auto;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 16px max(16px, calc((100vw - var(--max)) / 2));
        border-bottom: 1px solid var(--line);
        background: rgba(5, 7, 19, 0.78);
        backdrop-filter: blur(14px);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .brand-sigil {
        position: relative;
        display: block;
        flex: 0 0 auto;
        width: 40px;
        height: 40px;
        overflow: hidden;
        border: 1px solid var(--line-strong);
        background: rgba(2, 6, 23, 0.86);
        box-shadow: var(--shadow-cyan);
        clip-path: polygon(12% 0, 100% 0, 100% 76%, 84% 100%, 0 100%, 0 22%);
      }

      .site-name {
        margin: 0;
        font-family: var(--display);
        font-size: clamp(1rem, 1.4vw, 1.18rem);
        line-height: 1.1;
      }

      .latest-update {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 2px;
        color: var(--muted);
        font-size: 0.78rem;
      }

      .latest-update strong {
        color: #cbd5e1;
        font-weight: 500;
      }

      .date-button {
        min-height: 44px;
        border: 1px solid var(--line);
        background: rgba(15, 23, 42, 0.7);
        color: var(--text);
        text-decoration: none;
        cursor: pointer;
        transition: border-color 180ms ease, color 180ms ease, background 180ms ease, transform 180ms ease;
        clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
      }

      .date-button {
        padding: 0 14px;
      }

      .date-button:hover {
        border-color: var(--cyan);
        color: var(--cyan);
        transform: translateY(-1px);
      }

      .date-button:disabled {
        border-color: rgba(148, 163, 184, 0.12);
        background: rgba(15, 23, 42, 0.34);
        color: rgba(148, 163, 184, 0.48);
        cursor: not-allowed;
        transform: none;
      }

      .kicker,
      .meta-label,
      .mini-label {
        margin: 0;
        color: var(--cyan);
        font-family: var(--display);
        font-size: 0.76rem;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      .filter-trigger {
        display: inline-flex;
        flex: 0 0 auto;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .filter-trigger svg {
        width: 17px;
        height: 17px;
      }

      .scene-wrap {
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0.92;
      }

      .three-scene {
        position: absolute;
        inset: -2px;
      }

      .three-scene canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      .section {
        padding: 36px 0 52px;
      }

      .section-heading {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 22px;
      }

      .section-heading h2 {
        margin: 0;
        font-family: var(--display);
        font-size: clamp(1.35rem, 2.1vw, 1.9rem);
      }

      .section-heading p {
        max-width: 540px;
        margin: 0;
        color: var(--muted);
      }

      .filter-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .filter-modal {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: grid;
        place-items: center;
        padding: 18px;
        background: rgba(2, 6, 23, 0.74);
      }

      .filter-modal[hidden] {
        display: none;
      }

      .filter-dialog {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        width: min(620px, 100%);
        max-height: calc(100vh - 36px);
        border: 1px solid var(--line-strong);
        background:
          linear-gradient(135deg, rgba(34, 211, 238, 0.12), transparent 38%),
          linear-gradient(180deg, rgba(15, 23, 42, 0.98), rgba(2, 6, 23, 0.98));
        box-shadow: var(--shadow-cyan);
        clip-path: polygon(20px 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%, 0 20px);
      }

      .filter-dialog-header,
      .filter-dialog-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 16px 18px;
        border-bottom: 1px solid rgba(148, 163, 184, 0.18);
      }

      .filter-dialog-footer {
        border-top: 1px solid rgba(148, 163, 184, 0.18);
        border-bottom: 0;
      }

      .filter-dialog-title {
        margin: 0;
        font-family: var(--display);
        font-size: 1rem;
      }

      .filter-dialog-body {
        overflow-y: auto;
        padding: 18px;
      }

      .filter-field {
        display: grid;
        gap: 8px;
      }

      .filter-field label {
        display: block;
        color: var(--cyan);
        font-family: var(--display);
        font-size: 0.82rem;
      }

      .filter-field input,
      .filter-field select {
        width: 100%;
        min-height: 46px;
        padding: 0 14px;
        border: 1px solid var(--line);
        border-radius: 0;
        background: rgba(2, 6, 23, 0.86);
        color: var(--text);
      }

      .filter-field-wide {
        grid-column: 1 / -1;
      }

      .filter-dialog-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 10px;
      }

      .pager {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 22px;
        padding-top: 16px;
        border-top: 1px solid var(--line);
      }

      .pager-info {
        color: var(--muted);
        font-size: 0.92rem;
      }

      .pager-controls {
        display: flex;
        gap: 10px;
      }

      .showcase-shell {
        display: grid;
        gap: 18px;
      }

      .story-topline,
      .story-meta {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
      }

      .intel-row p {
        color: #dbe7fa;
      }

      .source-preview {
        position: relative;
        display: block;
        width: 100%;
        aspect-ratio: 21 / 6;
        margin-top: 20px;
        overflow: hidden;
        appearance: none;
        padding: 0;
        border: 1px solid rgba(34, 211, 238, 0.3);
        background:
          radial-gradient(circle at 18% 20%, rgba(34, 211, 238, 0.28), transparent 28%),
          radial-gradient(circle at 82% 70%, rgba(251, 63, 79, 0.2), transparent 30%),
          linear-gradient(135deg, rgba(34, 211, 238, 0.16), transparent 42%),
          rgba(2, 6, 23, 0.72);
        color: inherit;
        cursor: pointer;
        font: inherit;
        text-align: left;
        text-decoration: none;
        clip-path: polygon(16px 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%, 0 16px);
      }

      .source-preview::before {
        position: absolute;
        inset: 12px;
        content: "";
        border: 1px solid rgba(148, 163, 184, 0.16);
        background:
          linear-gradient(rgba(34, 211, 238, 0.07) 1px, transparent 1px),
          linear-gradient(90deg, rgba(34, 211, 238, 0.07) 1px, transparent 1px);
        background-size: 28px 28px;
        opacity: 0.8;
        clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
      }

      .source-preview-image::before {
        background:
          linear-gradient(180deg, transparent 32%, rgba(2, 6, 23, 0.76)),
          linear-gradient(90deg, rgba(2, 6, 23, 0.58), transparent 54%);
        opacity: 1;
      }

      .source-preview-image {
        height: clamp(180px, 24vw, 260px);
        aspect-ratio: auto;
      }

      .source-preview-image img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: saturate(0.94) contrast(1.05);
        transition: transform 220ms ease, filter 220ms ease;
      }

      .source-preview-image:hover img {
        transform: scale(1.025);
        filter: saturate(1) contrast(1.08);
      }

      .source-preview::after {
        position: absolute;
        top: 24px;
        right: 24px;
        width: 18%;
        max-width: 132px;
        aspect-ratio: 1;
        content: "";
        border: 1px solid rgba(34, 211, 238, 0.46);
        box-shadow: 0 0 22px rgba(34, 211, 238, 0.16);
        transform: rotate(45deg);
        transition: transform 180ms ease, border-color 180ms ease;
      }

      .source-preview:hover::after {
        border-color: var(--cyan);
        transform: rotate(45deg) scale(1.08);
      }

      .source-preview-content {
        position: absolute;
        inset: 24px;
        z-index: 1;
        display: grid;
        align-content: space-between;
        gap: 18px;
        color: var(--text);
      }

      .source-preview-image .source-preview-content {
        align-content: end;
      }

      .source-preview-brand {
        width: fit-content;
        padding: 6px 9px;
        border: 1px solid rgba(34, 211, 238, 0.42);
        background: rgba(2, 6, 23, 0.68);
        color: var(--cyan);
        font-family: var(--display);
        font-size: 0.78rem;
      }

      .source-preview-title {
        max-width: 75%;
        font-family: var(--display);
        font-size: clamp(1.1rem, 2.3vw, 1.85rem);
        line-height: 1.16;
      }

      .source-preview-source {
        color: var(--muted);
        font-size: 0.82rem;
      }

      .source-preview-source::after {
        color: var(--cyan);
        content: " / 查看詳情";
      }

      .source-preview-compact {
        max-width: 520px;
        max-height: 126px;
        margin: 12px 0 12px;
      }

      .source-preview-compact.source-preview-image {
        height: 126px;
        aspect-ratio: auto;
      }

      .source-preview-compact .source-preview-content {
        inset: 16px;
      }

      .source-preview-compact .source-preview-title {
        max-width: 80%;
        font-size: 1rem;
      }

      .source-preview-compact .source-preview-source {
        display: none;
      }

      .tagline {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 18px;
      }

      .tag,
      .status-tag,
      .importance-tag {
        display: inline-flex;
        align-items: center;
        min-height: 32px;
        padding: 0 9px;
        border: 1px solid rgba(148, 163, 184, 0.22);
        color: var(--muted);
        font-size: 0.82rem;
      }

      .status-released {
        border-color: rgba(34, 197, 94, 0.42);
        color: #bbf7d0;
      }

      .status-testing {
        border-color: rgba(34, 211, 238, 0.42);
        color: #a5f3fc;
      }

      .status-announced {
        border-color: rgba(96, 165, 250, 0.45);
        color: #bfdbfe;
      }

      .status-unverified {
        border-color: rgba(248, 113, 113, 0.42);
        color: #fecaca;
      }

      .importance-high {
        border-color: rgba(251, 63, 79, 0.52);
        color: #fecdd3;
      }

      .importance-medium {
        border-color: rgba(34, 211, 238, 0.34);
        color: #bae6fd;
      }

      .importance-low {
        border-color: rgba(148, 163, 184, 0.32);
        color: #cbd5e1;
      }

      .intel-actions {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
      }

      .intel-actions {
        justify-content: space-between;
        margin-top: 22px;
      }

      .intel-actions {
        align-self: auto;
        display: flex;
        flex-direction: row;
        justify-content: flex-start;
        min-height: 0;
        margin-top: 4px;
      }

      .source-link {
        color: var(--cyan);
        text-decoration: none;
        border-bottom: 1px solid rgba(34, 211, 238, 0.52);
      }

      .state-button {
        min-height: 42px;
        padding: 0 12px;
        border: 1px solid var(--line);
        background: rgba(2, 6, 23, 0.74);
        color: var(--text);
        cursor: pointer;
        transition: border-color 160ms ease, color 160ms ease, transform 160ms ease;
      }

      .state-button {
        position: relative;
        display: inline-grid;
        width: 42px;
        padding: 0;
        place-items: center;
      }

      .state-button svg {
        width: 18px;
        height: 18px;
        stroke: currentColor;
      }

      .note-marker {
        position: relative;
        display: inline-grid;
        width: 30px;
        height: 30px;
        place-items: center;
        border: 1px solid rgba(34, 211, 238, 0.42);
        background: rgba(34, 211, 238, 0.08);
        color: var(--cyan);
        vertical-align: middle;
      }

      .note-marker svg {
        width: 15px;
        height: 15px;
        stroke: currentColor;
      }

      .note-marker::before,
      .note-marker::after {
        position: absolute;
        left: 50%;
        z-index: 5;
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, 6px);
        transition: opacity 160ms ease, transform 160ms ease;
      }

      .note-marker::before {
        bottom: calc(100% + 10px);
        width: max-content;
        max-width: 150px;
        padding: 7px 9px;
        border: 1px solid rgba(34, 211, 238, 0.46);
        background: rgba(2, 6, 23, 0.96);
        color: var(--text);
        content: attr(data-tooltip);
        font-family: var(--body);
        font-size: 0.78rem;
        line-height: 1.3;
        white-space: nowrap;
        box-shadow: 0 0 18px rgba(34, 211, 238, 0.12);
        clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
      }

      .note-marker::after {
        bottom: calc(100% + 4px);
        width: 8px;
        height: 8px;
        border-right: 1px solid rgba(34, 211, 238, 0.46);
        border-bottom: 1px solid rgba(34, 211, 238, 0.46);
        background: rgba(2, 6, 23, 0.96);
        content: "";
        transform: translate(-50%, 6px) rotate(45deg);
      }

      .note-marker:hover::before,
      .note-marker:hover::after,
      .note-marker:focus-visible::before,
      .note-marker:focus-visible::after {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      .note-marker:hover::after,
      .note-marker:focus-visible::after {
        transform: translate(-50%, 0) rotate(45deg);
      }

      .state-button:hover {
        border-color: var(--cyan);
        color: var(--cyan);
        transform: translateY(-1px);
      }

      .state-button[aria-pressed="true"] {
        border-color: var(--green);
        color: #bbf7d0;
      }

      .state-button::before,
      .state-button::after {
        position: absolute;
        left: 50%;
        z-index: 5;
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, 6px);
        transition: opacity 160ms ease, transform 160ms ease;
      }

      .state-button::before {
        bottom: calc(100% + 10px);
        width: max-content;
        max-width: 160px;
        padding: 7px 9px;
        border: 1px solid rgba(34, 211, 238, 0.46);
        background: rgba(2, 6, 23, 0.96);
        color: var(--text);
        content: attr(data-tooltip);
        font-family: var(--body);
        font-size: 0.78rem;
        line-height: 1.3;
        white-space: nowrap;
        box-shadow: 0 0 18px rgba(34, 211, 238, 0.12);
        clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
      }

      .state-button::after {
        bottom: calc(100% + 4px);
        width: 8px;
        height: 8px;
        border-right: 1px solid rgba(34, 211, 238, 0.46);
        border-bottom: 1px solid rgba(34, 211, 238, 0.46);
        background: rgba(2, 6, 23, 0.96);
        content: "";
        transform: translate(-50%, 6px) rotate(45deg);
      }

      .state-button:hover::before,
      .state-button:hover::after,
      .state-button:focus-visible::before,
      .state-button:focus-visible::after {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      .state-button:hover::after,
      .state-button:focus-visible::after {
        transform: translate(-50%, 0) rotate(45deg);
      }

      .intel-list {
        display: grid;
        gap: 12px;
      }

      .intel-row {
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
        align-items: start;
        padding: 18px;
        scroll-margin-top: 82px;
        border-top: 1px solid var(--line);
        background: linear-gradient(90deg, rgba(34, 211, 238, 0.08), rgba(15, 23, 42, 0.62) 26%, rgba(2, 6, 23, 0.52));
        transition: background 180ms ease, border-color 180ms ease, transform 180ms ease;
      }

      .intel-row:hover {
        border-color: var(--cyan);
        background: linear-gradient(90deg, rgba(34, 211, 238, 0.13), rgba(15, 23, 42, 0.78) 28%, rgba(2, 6, 23, 0.6));
        transform: translateX(2px);
      }

      .intel-row.is-read {
        opacity: 0.68;
      }

      .intel-rank {
        color: var(--cyan);
        font-family: var(--display);
        font-size: 1.1rem;
      }

      .intel-main {
        min-width: 0;
      }

      .intel-heading {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: 14px;
        align-items: start;
      }

      .intel-row h3 {
        margin: 0 0 8px;
        font-family: var(--display);
        font-size: clamp(1rem, 1.35vw, 1.18rem);
        line-height: 1.3;
      }

      .intel-row p {
        margin: 0;
      }

      details {
        margin-top: 14px;
      }

      summary {
        min-height: 38px;
        color: var(--cyan);
        cursor: pointer;
      }

      .details-body {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        margin-top: 8px;
      }

      .details-body p {
        padding: 12px;
        border: 1px solid rgba(148, 163, 184, 0.18);
        background: rgba(2, 6, 23, 0.42);
      }

      .details-body strong {
        display: block;
        color: var(--cyan);
      }

      .detail-section {
        scroll-margin-top: 86px;
      }

      .detail-section[hidden] {
        display: none;
      }

      .detail-panel {
        border: 1px solid var(--line-strong);
        background:
          linear-gradient(135deg, rgba(34, 211, 238, 0.1), transparent 38%),
          linear-gradient(180deg, rgba(15, 23, 42, 0.96), rgba(2, 6, 23, 0.94));
        box-shadow: var(--shadow-cyan);
        clip-path: polygon(24px 0, 100% 0, 100% calc(100% - 24px), calc(100% - 24px) 100%, 0 100%, 0 24px);
      }

      .detail-inner {
        display: grid;
        gap: 24px;
        padding: clamp(22px, 4vw, 42px);
      }

      .detail-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        border-bottom: 1px solid rgba(148, 163, 184, 0.18);
        padding-bottom: 16px;
      }

      .detail-back {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 34px;
        padding: 0 10px;
        border: 1px solid var(--line);
        background: rgba(2, 6, 23, 0.42);
        color: var(--cyan);

            allReports.set(latestAvailableDate, latestReport);
            document.querySelector("[data-latest-update-date]").textContent = latestAvailableDate;

          </article>
        `;
      }

      function renderStories() {
        const filtered = allStories.filter(storyMatches);
        const pageCount = Math.max(1, Math.ceil(filtered.length / state.pageSize));
        state.page = Math.min(Math.max(1, state.page), pageCount);
        const start = (state.page - 1) * state.pageSize;
        const pageItems = filtered.slice(start, start + state.pageSize);
        const restSection = document.querySelector("[data-rest-section]");
        const list = document.querySelector("[data-intel-list]");
        const pager = document.querySelector("[data-pager]");
        const pageInfo = document.querySelector("[data-page-info]");
        const prevPage = document.querySelector("[data-page-prev]");
        const nextPage = document.querySelector("[data-page-next]");
        const resultCount = document.querySelector("[data-result-count]");
        const hasAnyStories = filtered.length > 0;

        restSection.hidden = !hasAnyStories;
        pager.hidden = !hasAnyStories;
        if (resultCount) resultCount.textContent = `${filtered.length} 篇文章`;

        if (!hasAnyStories) {
          list.innerHTML = "";
          pageInfo.textContent = "";
          return;
        }

        list.innerHTML = pageItems.map((item, index) => rowMarkup(item, start + index + 1)).join("");
        pageInfo.textContent = `第 ${state.page} / ${pageCount} 頁 · 顯示 ${start + 1}-${start + pageItems.length} / ${filtered.length}`;
        prevPage.disabled = state.page <= 1;
        nextPage.disabled = state.page >= pageCount;

      }

      function scrollToFirstArticle() {
        const firstArticle = document.querySelector("[data-intel-list] .intel-row");
        if (!firstArticle) return;
        const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        firstArticle.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" });
      }

      function initFallbackScene(container) {
        const canvas = document.createElement("canvas");
        const context = canvas.getContext("2d");
        container.appendChild(canvas);
        const particles = Array.from({ length: 18 }, (_, index) => ({
          x: Math.random(),
          y: Math.random(),
          z: Math.random(),
          phase: index * 0.17
        }));
        const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        function resize() {
          const rect = container.getBoundingClientRect();
          canvas.width = Math.max(1, Math.floor(rect.width * window.devicePixelRatio));
          canvas.height = Math.max(1, Math.floor(rect.height * window.devicePixelRatio));
          canvas.style.width = `${rect.width}px`;
          canvas.style.height = `${rect.height}px`;
          context.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
        }

        function draw(time = 0) {
          const rect = container.getBoundingClientRect();
          context.clearRect(0, 0, rect.width, rect.height);
          const size = Math.min(rect.width, rect.height);
          const gradient = context.createRadialGradient(rect.width * 0.5, rect.height * 0.5, size * 0.04, rect.width * 0.5, rect.height * 0.5, size * 0.72);
          gradient.addColorStop(0, "rgba(34,211,238,0.25)");
          gradient.addColorStop(0.55, "rgba(37,99,235,0.1)");
          gradient.addColorStop(1, "rgba(2,6,23,0)");
          context.fillStyle = gradient;
          context.fillRect(0, 0, rect.width, rect.height);

          particles.forEach((particle) => {
            const drift = reduceMotion ? 0 : Math.sin(time * 0.001 + particle.phase) * 0.025;
            const x = rect.width * (particle.x + drift);
            const y = rect.height * particle.y;
            const particleSize = 0.7 + particle.z * 1.1;
            context.fillStyle = particle.z > 0.62 ? "rgba(251,63,79,0.82)" : "rgba(34,211,238,0.82)";
            context.fillRect(x, y, particleSize, particleSize);
          });

          context.save();
          context.translate(rect.width * 0.5, rect.height * 0.5);
          context.rotate(reduceMotion ? 0.4 : time * 0.00035);
          context.strokeStyle = "rgba(34,211,238,0.9)";
          context.lineWidth = Math.max(1, size * 0.035);
          context.strokeRect(size * -0.28, size * -0.28, size * 0.56, size * 0.56);
          context.strokeStyle = "rgba(251,63,79,0.82)";
          context.rotate(0.78);
          context.strokeRect(size * -0.2, size * -0.2, size * 0.4, size * 0.4);
          context.restore();

          if (!reduceMotion) window.requestAnimationFrame(draw);
        }

        resize();
        draw();
        window.addEventListener("resize", resize);
      }

      function initThreeScene() {
        const container = document.querySelector("#three-scene");
        import("https://unpkg.com/three@0.160.0/build/three.module.js")
          .then((THREE) => {
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(58, 1, 0.1, 100);
            camera.position.set(0, 0.25, 5.2);

            const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setClearColor(0x000000, 0);
            container.appendChild(renderer.domElement);

            const cyan = new THREE.MeshBasicMaterial({ color: 0x22d3ee, wireframe: true, transparent: true, opacity: 0.7 });
            const red = new THREE.MeshBasicMaterial({ color: 0xfb3f4f, wireframe: true, transparent: true, opacity: 0.55 });
            const core = new THREE.Mesh(new THREE.IcosahedronGeometry(1.45, 2), cyan);
            const ring = new THREE.Mesh(new THREE.TorusKnotGeometry(1.65, 0.045, 180, 10, 2, 5), red);
            const halo = new THREE.Mesh(new THREE.TorusGeometry(2.15, 0.025, 8, 180), cyan);
            halo.rotation.x = Math.PI / 2.8;
            scene.add(core, ring, halo);

            const grid = new THREE.GridHelper(8, 18, 0x22d3ee, 0x2563eb);
            grid.position.y = -1.9;
            grid.material.transparent = true;
            grid.material.opacity = 0.22;
            scene.add(grid);

            const stars = new THREE.BufferGeometry();
            const positions = [];
            for (let index = 0; index < 260; index += 1) {
              positions.push((Math.random() - 0.5) * 10, (Math.random() - 0.5) * 7, (Math.random() - 0.5) * 8);
            }
            stars.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
            const starMaterial = new THREE.PointsMaterial({ color: 0x7dd3fc, size: 0.025, transparent: true, opacity: 0.75 });
            scene.add(new THREE.Points(stars, starMaterial));

            const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

            function resize() {
              const rect = container.getBoundingClientRect();
              const width = Math.max(1, rect.width);
              const height = Math.max(1, rect.height);
              camera.aspect = width / height;
              camera.updateProjectionMatrix();
              renderer.setSize(width, height, false);
            }

            function animate(time = 0) {
              const tick = time * 0.001;
              core.rotation.x = tick * 0.42;
              core.rotation.y = tick * 0.55;
              ring.rotation.x = tick * 0.22;
              ring.rotation.z = tick * 0.38;
              halo.rotation.z = tick * 0.26;
              renderer.render(scene, camera);
              if (!reduceMotion) window.requestAnimationFrame(animate);
            }

            resize();
            animate();
            window.addEventListener("resize", resize);
          })
          .catch(() => initFallbackScene(container));
      }

      document.addEventListener("click", (event) => {
        const saveButton = event.target.closest("[data-save]");
        if (saveButton) {
          const id = saveButton.dataset.save;
          saved.has(id) ? saved.delete(id) : saved.add(id);
          renderStories();
          showToast(saved.has(id) ? "已加入收藏佇列。" : "已移出收藏佇列。");
          return;
        }

        const readButton = event.target.closest("[data-read]");
        if (readButton) {
          const id = readButton.dataset.read;
          read.has(id) ? read.delete(id) : read.add(id);
          renderStories();
          showToast(read.has(id) ? "已標記為已讀。" : "已改回未讀。");
          return;
        }

        if (event.target.closest("[data-page-prev]")) {
          state.page -= 1;
          renderStories();
          scrollToFirstArticle();
          return;
        }

        if (event.target.closest("[data-page-next]")) {
          state.page += 1;
          renderStories();
          scrollToFirstArticle();
          return;
        }

        if (event.target.closest("[data-open-filters]")) {
          openFilters();
          return;
        }

        if (event.target.closest("[data-close-filters]")) {
          closeFilters();
          return;
        }

        if (event.target === filterModal) {
          closeFilters();
          return;
        }

        if (event.target.closest("[data-reset-filters]")) {
          draftFilters = { ...defaultFilters };
          syncFilterControls(draftFilters);
          return;
        }

        if (event.target.closest("[data-apply-filters]")) {
          applyFilters();
          return;
        }

      });

      filterBindings.forEach(([selector, key]) => {
        const control = document.querySelector(selector);
        const eventName = key === "search" ? "input" : "change";
        control.addEventListener(eventName, (event) => {
          draftFilters[key] = event.target.value;
        });
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && !filterModal.hidden) {
          closeFilters();
        }
      });

      loadAllReports();
      loadNotesIndex();
      initThreeScene();
    </script>
  </body>
</html>
